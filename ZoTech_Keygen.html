<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoTech POS — أداة توليد مفاتيح التفعيل الرسمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .card-header {
      background: linear-gradient(180deg, #162433 0%, #0d1620 100%);
      color: #ffffff;
      padding: 22px 20px;
      text-align: center;
      border-bottom: 2px solid #243b55;
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #243b55;
      color: #38bdf8;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 26px;
    }
    .card-body { padding: 24px; }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 5px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #0284c7;
      color: #ffffff;
      transition: background 0.2s;
      font-family: 'Cairo', sans-serif;
    }
    .btn:hover { background: #0369a1; }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: #f0fdf4;
      border: 2px dashed #16a34a;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .result-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #15803d;
      letter-spacing: 2px;
      margin: 10px 0;
      user-select: all;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    .copy-btn:hover { background: #15803d; }
    .footer {
      background: #f8fafc;
      padding: 10px 18px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      justifyContent: space-between;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="icon-badge">🔐</div>
      <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 4px;">ZoTech POS — مولد مفاتيح التفعيل</h2>
      <div style="font-size: 12px; color: #38bdf8;">أداة الإدارة لتوليد تراخيص العملاء المقفلة بالماك أدرس</div>
    </div>

    <div class="card-body">
      <div class="form-group">
        <label>أدخل كود الجهاز المرسل من العميل (Machine ID):</label>
        <input type="text" id="machineIdInput" placeholder="مثال: ZT-5E4F-8CB0-6B47" autofocus>
      </div>

      <button type="button" class="btn" onclick="handleGenerate()">توليد مفتاح التفعيل الآن ⚡</button>

      <div class="result-box" id="resultBox">
        <div style="font-size: 12px; font-weight: 700; color: #166534;">مفتاح التفعيل المرخص لهذا الجهاز (مدى الحياة):</div>
        <div class="result-key" id="resultKey">XXXX-XXXX-XXXX-XXXX</div>
        <button type="button" class="copy-btn" id="copyBtn" onclick="handleCopy()">
          <span>📋 نسخ المفتاح لإرساله للعميل</span>
        </button>
      </div>
    </div>

    <div class="footer">
      <span>تطوير وإشراف: <strong>ZoTech Software</strong></span>
      <span>هاتف / واتساب: <strong>01275984405</strong></span>
    </div>
  </div>

  <script>
    const SECRET_SALT = 'ZoTech-POS-SuperMarket-2024-@SecretMasterKey#984405';

    async function generateLicense(machineId) {
      const cleanId = machineId.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      const encoder = new TextEncoder();
      const keyData = encoder.encode(SECRET_SALT);
      const cryptoKey = await crypto.subtle.importKey(
        'raw',
        keyData,
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign']
      );
      const signature = await crypto.subtle.sign(
        'HMAC',
        cryptoKey,
        encoder.encode('LIFETIME-POS-' + cleanId)
      );
      const hashArray = Array.from(new Uint8Array(signature));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      return hashHex.slice(0, 4) + '-' + hashHex.slice(4, 8) + '-' + hashHex.slice(8, 12) + '-' + hashHex.slice(12, 16);
    }

    async function handleGenerate() {
      const input = document.getElementById('machineIdInput').value.trim();
      if (!input) {
        alert('يرجى إدخال كود الجهاز أولاً');
        return;
      }

      const key = await generateLicense(input);
      document.getElementById('resultKey').innerText = key;
      document.getElementById('resultBox').style.display = 'block';
    }

    function handleCopy() {
      const key = document.getElementById('resultKey').innerText;
      navigator.clipboard.writeText(key).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<span>✅ تم نسخ المفتاح بنجاح!</span>';
        setTimeout(() => {
          btn.innerHTML = '<span>📋 نسخ المفتاح لإرساله للعميل</span>';
        }, 2500);
      });
    }

    document.getElementById('machineIdInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleGenerate();
    });
  </script>
</body>
</html>
